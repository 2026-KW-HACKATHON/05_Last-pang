<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-48.png" />
    <!-- iOS는 manifest 아이콘 대신 이 파일을 홈 화면 아이콘으로 쓴다 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- manifest의 theme_color와 같은 값 (index.css --color-accent) -->
    <meta name="theme-color" content="#C61747" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>동네냠냠</title>
    <!-- C12 공유 미리보기 (카카오톡·문자). 딜마다 다른 이미지는 서버 렌더링이 필요해 공통 이미지 1장을 쓴다 -->
    <meta name="description" content="한산한 가게와 한가한 주민의 시간을 이어줘요. 월계1동 실시간 타임딜" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="동네냠냠" />
    <meta property="og:title" content="동네냠냠 · 월계1동 실시간 타임딜" />
    <meta property="og:description" content="한산한 가게와 한가한 주민의 시간을 이어줘요" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- iOS 홈 화면 앱: 전체 화면 + 상태 표시줄 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="동네냠냠" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
