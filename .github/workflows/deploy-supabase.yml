# develop·main에 supabase/ 변경이 머지되면 원격 Supabase에 반영한다
name: Deploy Supabase

on:
  push:
    branches: [develop, main]
    paths: ['supabase/migrations/**', 'supabase/functions/**']
  workflow_dispatch: # Actions 탭에서 손으로도 실행 가능

concurrency:
  group: supabase-deploy # 두 머지가 겹쳐도 차례로 실행
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push # seed.sql은 원격에 넣지 않는다
      - name: Edge Function 배포 (함수 폴더가 있을 때만)
        run: |
          if [ -d supabase/functions ] && [ -n "$(ls -A supabase/functions)" ]; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
          fi
